<section class="bg-white p-5 rounded-2xl fixed bottom-5 right-5 z-50 shadow-gray-700 w-62.5">
  <h2 class="text-2xl font-bold text-black mb-2">
    Zoom

    <small class="text-gray-500 font-normal">{{ zoom() | number: '1.0-0' }}</small>
  </h2>

  <input
    type="range"
    min="1"
    max="19"
    [value]="zoom()"
    class="range range-primary"
    (input)="zoom.set(+txtZoom.value)"
    #txtZoom
  />

  <h2 class="text-2xl font-bold text-black mb-2">Coordenadas</h2>
  <pre class="text-sm text-gray-500 font-normal"
    >{{
      {
        latitude: coordinates().lat | number: '1.4-4',
        longitude: coordinates().lng | number: '1.4-4',
      } | json
    }}
  </pre>

  <h2 class="text-2xl font-bold text-black mb-2">Estilo</h2>
  <div class="join gap-2">
    <input
      type="checkbox"
      [checked]="isToggled()"
      (input)="toggle(!isToggled())"
      class="checkbox checkbox-primary"
    />

    <label class="text-sm text-gray-500 font-normal"> Satelite </label>
  </div>
</section>

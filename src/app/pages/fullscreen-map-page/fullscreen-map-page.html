<div class="relative h-[calc(100vh-64px)] w-screen">
  <div #map class="h-full w-full"></div>

  <section class="absolute right-5 bottom-5 z-50 w-64 rounded-xl border border-line bg-white p-6">
    <p class="mb-1 text-[0.7rem] font-medium uppercase tracking-[0.08em] text-muted">
      Vista
    </p>
    <h2 class="font-serif text-2xl text-ink">
      Zoom
      <small class="ml-1 font-mono text-sm font-normal tracking-normal text-muted">
        {{ zoom() | number: '1.0-0' }}
      </small>
    </h2>

    <input
      type="range"
      min="1"
      max="19"
      [value]="zoom()"
      class="control-range mt-4"
      (input)="zoom.set(+txtZoom.value)"
      #txtZoom
    />

    <h3 class="mt-6 font-serif text-xl text-ink">Coordenadas</h3>
    <div class="mt-2 flex flex-col gap-1.5">
      <kbd>lat {{ coordinates().lat | number: '1.4-4' }}</kbd>
      <kbd>lng {{ coordinates().lng | number: '1.4-4' }}</kbd>
    </div>

    <h3 class="mt-6 font-serif text-xl text-ink">Estilo</h3>
    <label class="mt-3 flex cursor-pointer items-center gap-2.5 text-sm text-muted">
      <input
        type="checkbox"
        class="control-check"
        [checked]="isToggled()"
        (input)="toggle(!isToggled())"
      />
      Satélite
    </label>
  </section>
</div>

<header class="relative z-20 border-b border-line bg-white">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6">
    <a
      routerLink="/fullscreen"
      class="font-serif text-[1.35rem] tracking-tight text-ink no-underline"
      (click)="closeMenu()"
    >
      Atlas
    </a>

    <p class="hidden font-serif text-lg text-muted sm:block">{{ pageTitle() }}</p>

    <nav class="hidden items-center gap-6 md:flex">
      @for (route of routes; track route.path) {
        <a
          [routerLink]="route.path"
          routerLinkActive="text-ink"
          class="flex items-center gap-2 text-[0.8rem] font-medium uppercase tracking-[0.08em] text-muted no-underline transition-colors duration-200 hover:text-ink"
        >
          @switch (route.path) {
            @case ('fullscreen') {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
                <path d="M228.92,49.69a8,8,0,0,0-6.86-1.45L160.93,63.52,99.58,33.08a8,8,0,0,0-5.52-.6l-64,16A8,8,0,0,0,24,56V200a8,8,0,0,0,9.94,7.76l61.13-15.28,61.35,30.44a8.15,8.15,0,0,0,3.58.84,8,8,0,0,0,1.94-.24l64-16A8,8,0,0,0,232,200V56A8,8,0,0,0,228.92,49.69ZM104,52.94l48,23.88V203.06L104,179.18ZM40,62.25l56-14V178.75l-56,14ZM216,193.75l-56,14V77.25l56-14Z"></path>
              </svg>
            }
            @case ('markers') {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
                <path d="M128,16a88.1,88.1,0,0,0-88,88c0,75.3,80,132.17,83.41,134.55a8,8,0,0,0,9.18,0C136,236.17,216,179.3,216,104A88.1,88.1,0,0,0,128,16Zm0,56a32,32,0,1,1-32,32A32,32,0,0,1,128,72Z"></path>
              </svg>
            }
            @case ('houses') {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
                <path d="M240,208H224V96a16,16,0,0,0-16-16H144V32a16,16,0,0,0-24.91-13.31l-88,48.48A16,16,0,0,0,24,80.48V208H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM40,80.48,128,32V208H40ZM208,208H144V96h64Z"></path>
              </svg>
            }
          }
          {{ route.title }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-md border border-line bg-white text-ink md:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir navegación"
    >
      @if (menuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"></path>
        </svg>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-line bg-white px-6 py-4 md:hidden">
      <ul class="flex flex-col gap-3">
        @for (route of routes; track route.path) {
          <li>
            <a
              [routerLink]="route.path"
              routerLinkActive="text-ink"
              class="block py-1 text-[0.8rem] font-medium uppercase tracking-[0.08em] text-muted no-underline"
              (click)="closeMenu()"
            >
              {{ route.title }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
